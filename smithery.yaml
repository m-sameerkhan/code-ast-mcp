# Smithery configuration file
# https://smithery.ai/docs/build/publish
$schema: https://smithery.ai/schema/v1/smithery.json

# Local stdio server - distributed as MCPB bundle
startCommand:
  type: stdio
  config:
    command: python
    args:
      - "-m"
      - "code_ast_mcp.server"

# Server metadata for Smithery listing
description: >
  A Python AST-powered codebase inspector MCP server.
  Analyze Python files, search symbols, map import dependencies,
  audit docstring coverage — without loading raw source files into LLM context.
