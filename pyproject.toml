[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-ast-mcp"
version = "0.1.0"
description = "A Python AST Codebase Architecture & Symbol Inspector MCP Server"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
keywords = ["mcp", "model-context-protocol", "ast", "python", "static-analysis", "code-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
]

[project.scripts]
code-ast-mcp = "code_ast_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["code_ast_mcp"]
